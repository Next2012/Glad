        function updateToolShortcuts(toolKey) {
            const usesUsageCommand = ['antigravity', 'claude-code'].includes(toolKey);
            const usageCommand = usesUsageCommand ? '/usage' : '/stat';
            const defaultShortcuts = [
                { key: 'left', label: '←', special: true },
                { key: 'right', label: '→', special: true },
                { key: 'ctrl-c', label: 'Ctrl+C' },
                { command: '/model' },
                { command: '/resume' },
                { command: usageCommand }
            ];
            const toolShortcuts = {
                codex: [
                    { key: 'ctrl-c', label: 'Ctrl+C' },
                    { key: 'codex-perm', label: '/perm', title: 'Send /perm' },
                    { command: '/model' },
                    { command: '/resume' },
                    { command: '/stat' }
                ]
            };
            const shortcuts = toolShortcuts[toolKey] || defaultShortcuts;
            const shortcutGroup = document.querySelector('[data-role="tool-shortcuts"]');
            if (!shortcutGroup) return;

            shortcutGroup.style.gridTemplateColumns = `repeat(${shortcuts.length}, minmax(0, 1fr))`;
            shortcutGroup.replaceChildren(...shortcuts.map(shortcut => {
                const button = document.createElement(shortcut.command ? 'button' : 'div');
                button.className = shortcut.command
                    ? 'command-key'
                    : `key-btn${shortcut.special ? ' special-key' : ''}`;
                if (shortcut.command) {
                    button.dataset.command = shortcut.command;
                    button.textContent = shortcut.command;
                    button.title = `Send ${shortcut.command}`;
                } else {
                    button.dataset.key = shortcut.key;
                    button.textContent = shortcut.label;
                    button.title = shortcut.title || '';
                }
                return button;
            }));
        }

        function codexText(text) { return escapeHtml(text || '').replace(/\n/g, '<br>'); }
        function codexJson(value) {
            if (typeof value === 'string') return value;
            try { return JSON.stringify(value || {}, null, 2); } catch (_) { return String(value || ''); }
        }
        function codexToolStatus(item) {
            const status = item.toolStatus || 'running';
            if (status === 'inProgress') return 'running';
            if (status === 'failed' || status === 'declined') return status;
            if (status === 'completed') return item.exitCode && item.exitCode !== 0 ? 'failed' : 'completed';
            return status;
        }
        function renderCodexDiff(diff) {
            return `<div class="codex-diff">${String(diff || '').split('\n').map(line => {
                const type = line.startsWith('+++') || line.startsWith('---') ? 'hunk' : line.startsWith('+') ? 'add' : line.startsWith('-') ? 'del' : line.startsWith('@@') ? 'hunk' : '';
                return `<div class="codex-diff-line ${type}">${escapeHtml(line || ' ')}</div>`;
            }).join('')}</div>`;
        }
        function normalizeCodexChanges(changes) {
            if (Array.isArray(changes)) return changes.filter(Boolean).map(change => [change.path || 'File', change]);
            if (changes && typeof changes === 'object') return Object.entries(changes);
            return [];
        }
        function codexChangeDiff(change = {}) {
            if (typeof change.diff === 'string') return change.diff;
            if (typeof change.unified_diff === 'string') return change.unified_diff;
            const kind = change.kind && typeof change.kind === 'object' ? change.kind : {};
            const type = change.type || kind.type || '';
            const oldText = change.modify?.old_content ?? change.old_content ?? change.oldContent ?? (type === 'delete' ? change.content : change.delete?.content) ?? '';
            const newText = change.modify?.new_content ?? change.new_content ?? change.newContent ?? (type === 'add' ? change.content : change.add?.content) ?? '';
            if (!oldText && !newText) return '';
            return `${String(oldText).split('\n').map(line => `-${line}`).join('\n')}\n${String(newText).split('\n').map(line => `+${line}`).join('\n')}`;
        }
        function renderCodexPatch(item) {
            const entries = normalizeCodexChanges(item.changes || item.input?.changes);
            if (!entries.length) return `<div class="codex-tool-body"><pre class="codex-tool-code">${escapeHtml(codexJson(item.input))}</pre></div>`;
            return entries.map(([path, change]) => {
                const kind = change?.type || change?.kind?.type || 'edit';
                const move = change?.move_path || change?.kind?.move_path;
                const diff = codexChangeDiff(change);
                return `<details class="codex-patch-file"><summary><span class="path">${escapeHtml(path)}${move ? ` → ${escapeHtml(move)}` : ''}</span><span class="codex-patch-kind">${escapeHtml(kind)}</span></summary>${diff ? renderCodexDiff(diff) : ''}</details>`;
            }).join('');
        }
        function renderCodexPermission(request, inline = false) {
            if (!request) return '';
            const pending = request.status === 'pending';
            const labels = { approved: 'Allowed once', approved_for_session: 'Allowed for session', denied: 'Denied', abort: 'Stopped' };
            const detail = request.reason || (request.input && Object.keys(request.input).length ? codexJson(request.input) : '');
            const content = `${inline ? `<div class="codex-inline-permission-title">${escapeHtml(request.title || 'Permission required')}</div>` : ''}${detail ? `<div>${codexText(detail)}</div>` : ''}${pending ? `<div class="claude-permission-actions"><button class="small-btn primary" onclick="respondCodexPermission('${escapeHtml(request.id)}', 'approved')">Yes</button><button class="small-btn" onclick="respondCodexPermission('${escapeHtml(request.id)}', 'approved_for_session')">Yes, for session</button><button class="small-btn danger" onclick="respondCodexPermission('${escapeHtml(request.id)}', 'abort')">Stop and explain</button></div>` : `<div class="codex-permission-result">${escapeHtml(labels[request.decision] || request.status)}</div>`}`;
            if (inline) return `<div class="codex-inline-permission">${content}</div>`;
            return `<div class="claude-tool claude-permission"><div class="claude-tool-header"><strong>${escapeHtml(request.title || 'Permission required')}</strong></div><div class="claude-tool-body">${content}</div></div>`;
        }
        function renderCodexTool(item, permission = null) {
            const status = codexToolStatus(item);
            const isError = status === 'failed' || Boolean(item.error) || (item.exitCode != null && item.exitCode !== 0);
            const runningClass = status === 'running' ? ' running' : '';
            if (item.name === 'CodexPatch') {
                return `<div class="codex-tool${isError ? ' error' : ''}">${renderCodexPatch(item)}${permission ? renderCodexPermission(permission, true) : ''}</div>`;
            }
            const command = item.name === 'CodexBash' ? item.command : item.title || item.tool || '';
            const icon = item.name === 'CodexBash' ? '>_' : item.name === 'McpTool' ? 'MCP' : item.name === 'Agent' ? 'A' : '•';
            const title = item.name === 'CodexBash' ? 'Command' : item.title || item.name || 'Tool';
            const result = item.result || (item.name === 'McpTool' || item.name === 'Agent' ? codexJson(item.input) : '');
            return `<details class="codex-tool${isError ? ' error' : ''}"><summary class="codex-tool-header"><span class="codex-tool-icon">${escapeHtml(icon)}</span><span class="codex-tool-title">${escapeHtml(title)}</span>${command && command !== title ? `<span class="codex-tool-command">${escapeHtml(command)}</span>` : '<span class="codex-tool-command"></span>'}<span class="codex-tool-state${runningClass}">${escapeHtml(status === 'completed' ? '' : status)}</span></summary>${result ? `<div class="codex-tool-body"><pre class="codex-tool-code">${escapeHtml(result)}</pre></div>` : ''}${permission ? renderCodexPermission(permission, true) : ''}</details>`;
        }
        function renderCodexToolGroup(items, permissionById, usedPermissions) {
            const running = items.some(item => codexToolStatus(item) === 'running');
            const failed = items.some(item => codexToolStatus(item) === 'failed' || item.error);
            const startedAt = Math.min(...items.map(item => Number(item.createdAt || Date.now())));
            const seconds = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
            const tools = items.map(item => {
                const permission = permissionById.get(String(item.providerId || ''));
                if (permission) usedPermissions.add(permission.id);
                return renderCodexTool(item, permission);
            }).join('');
            return `<details class="codex-work-group"${running ? ' open' : ''}><summary>${running ? 'Working' : failed ? 'Work finished with errors' : `Worked for ${seconds}s`} · ${items.length} tools</summary><div class="codex-work-group-body">${tools}</div></details>`;
        }
        function renderCodexChat() {
            const container = document.getElementById('codex-chat-container');
            if (!container) return;
            const parts = [];
            const permissionById = new Map(codexPendingPermissions.map(item => [String(item.id), item]));
            const usedPermissions = new Set();
            const visible = codexMessages.filter(item => !['reasoning', 'turn-start', 'turn-end'].includes(item.kind));
            for (let i = 0; i < visible.length;) {
                const item = visible[i];
                if (item.kind === 'tool') {
                    const tools = [];
                    while (i < visible.length && visible[i].kind === 'tool') tools.push(visible[i++]);
                    if (tools.length > 1) parts.push(renderCodexToolGroup(tools, permissionById, usedPermissions));
                    else {
                        const permission = permissionById.get(String(tools[0].providerId || ''));
                        if (permission) usedPermissions.add(permission.id);
                        parts.push(renderCodexTool(tools[0], permission));
                    }
                    continue;
                }
                if (item.kind === 'assistant') parts.push(`<div class="codex-message assistant claude-md">${renderMarkdown(item.text || '')}</div>`);
                else if (item.kind === 'user') parts.push(`<div class="codex-message user claude-md">${renderMarkdown(item.text || '')}</div>`);
                else parts.push(`<div class="codex-message ${escapeHtml(item.level === 'error' ? 'event error' : item.kind || 'event')}">${codexText(item.text)}</div>`);
                i += 1;
            }
            for (const request of codexPendingPermissions) if (!usedPermissions.has(request.id)) parts.push(renderCodexPermission(request));
            container.innerHTML = `<div class="codex-conversation">${parts.join('') || '<div class="codex-message event">Send a message to start Codex.</div>'}</div>`;
            requestAnimationFrame(() => { container.scrollTop = container.scrollHeight; });
        }

        function applyCodexState(state = {}) {
            codexState = { ...codexState, ...state };
            const permission = document.getElementById('codex-permission-select');
            if (permission) permission.value = codexState.permissionMode || 'on-request';
            const modelButton = document.getElementById('codex-model-btn');
            if (modelButton) modelButton.textContent = codexState.model ? codexState.model.replace(/^gpt-/, '').slice(0, 10) : 'Model';
            const abort = document.getElementById('codex-abort-btn');
            if (abort) abort.disabled = !codexState.canAbort;
            const terminal = document.getElementById('codex-terminal-switch');
            if (terminal) { terminal.textContent = codexState.presentation === 'terminal' ? 'CHAT' : 'TERM'; terminal.disabled = codexState.presentation === 'structured' && !codexState.canSwitchToTerminal; terminal.title = codexState.presentation === 'terminal' ? 'Return to Codex chat' : 'Switch to Codex terminal'; }
            renderCodexStateBar();
            renderCodexModelPanel();
            setClaudeModeEnabled(isClaudeSession());
            renderCodexChat();
        }

        function renderCodexStateBar() {
            const el = document.getElementById('codex-state-bar');
            if (!el) return;
            const pending = Number(codexState.pendingPermissionCount || codexPendingPermissions.filter(item => item.status === 'pending').length) || 0;
            const parts = [];
            if (pending || codexState.status === 'waiting_approval') parts.push(`<span class="claude-state-pill warn">${pending || 1} approval${pending === 1 ? '' : 's'}</span>`);
            else if (codexState.status === 'running') parts.push('<span class="claude-state-pill">Working</span>');
            el.innerHTML = parts.join('');
            el.style.display = parts.length ? 'flex' : 'none';
        }

        function toggleCodexModelPanel() {
            codexModelPanelOpen = !codexModelPanelOpen;
            codexResumePanelOpen = false;
            codexModelCandidate = codexState.model || codexState.models?.[0]?.id || null;
            document.getElementById('codex-resume-panel').classList.remove('active');
            renderCodexModelPanel();
            updateTerminalControlsHeight();
        }

        function renderCodexModelPanel() {
            const panel = document.getElementById('codex-model-panel');
            if (!panel) return;
            panel.classList.toggle('active', codexModelPanelOpen);
            if (!codexModelPanelOpen) { panel.innerHTML = ''; return; }
            const models = codexState.models || [];
            const candidate = models.find(item => item.id === codexModelCandidate) || models.find(item => item.id === codexState.model) || models[0];
            if (!candidate) { panel.innerHTML = '<div class="claude-resume-meta" style="padding:12px;">Loading models...</div>'; return; }
            codexModelCandidate = candidate.id;
            const efforts = candidate.efforts?.length ? candidate.efforts : [candidate.defaultEffort || 'medium'];
            panel.innerHTML = `<div class="codex-picker-column">${models.map(item => `<button class="codex-picker-option${item.id === candidate.id ? ' selected' : ''}" onclick="selectCodexModelCandidate(decodePathValue('${encodePathValue(item.id)}'))">${escapeHtml(item.label || item.id)}</button>`).join('')}</div><div class="codex-picker-column">${efforts.map(effort => `<button class="codex-picker-option${candidate.id === codexState.model && effort === codexState.effort ? ' selected' : ''}" onclick="chooseCodexModelEffort(decodePathValue('${encodePathValue(candidate.id)}'), decodePathValue('${encodePathValue(effort)}'))">${escapeHtml(effort)}</button>`).join('')}</div>`;
        }

        function selectCodexModelCandidate(model) { codexModelCandidate = model; renderCodexModelPanel(); }
        function chooseCodexModelEffort(model, effort) {
            codexModelPanelOpen = false;
            applyCodexState({ model, effort });
            sendCodexSettings({ model, effort });
            updateTerminalControlsHeight();
        }

        function applyCodexEvent(event) {
            if (!event) return;
            if (event.type === 'message' && event.message) codexMessages.push(event.message);
            else if (event.type === 'message-updated' && event.message) { const i = codexMessages.findIndex(item => item.id === event.message.id); if (i >= 0) codexMessages[i] = event.message; else codexMessages.push(event.message); }
            else if (event.type === 'history-reset') codexMessages = event.messages || [];
            else if (event.type === 'permission-request' && event.request) { codexPendingPermissions = [...codexPendingPermissions.filter(item => item.id !== event.request.id), event.request]; }
            else if (event.type === 'permission-updated' && event.request) codexPendingPermissions = codexPendingPermissions.map(item => item.id === event.request.id ? event.request : item);
            if (event.state) applyCodexState(event.state); else renderCodexChat();
        }

        function sendCodexSettings(settings) { if (currentSocket?.readyState === 1) currentSocket.send(JSON.stringify({ type: 'codex-settings', settings })); }
        function updateCodexSettingsFromControls() { const permissionMode = document.getElementById('codex-permission-select').value; applyCodexState({ permissionMode }); sendCodexSettings({ permissionMode }); }
        function abortCodexSession() { if (currentSocket?.readyState === 1) currentSocket.send(JSON.stringify({ type: 'codex-abort' })); }
        function respondCodexPermission(id, decision) { if (currentSocket?.readyState === 1) currentSocket.send(JSON.stringify({ type: 'codex-permission', id, decision })); }
        async function toggleCodexResumePanel() {
            codexResumePanelOpen = !codexResumePanelOpen;
            codexModelPanelOpen = false;
            document.getElementById('codex-model-panel').classList.remove('active');
            const panel = document.getElementById('codex-resume-panel');
            panel.classList.toggle('active', codexResumePanelOpen);
            updateTerminalControlsHeight();
            if (!codexResumePanelOpen) return;
            panel.innerHTML = '<div class="claude-resume-meta" style="padding:12px;">Loading sessions...</div>';
            try {
                const res = await fetchWithTimeout(`/api/sessions/${activeSessionId}/codex-resume-threads`, {}, 30000);
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.error || 'Failed to load Codex sessions');
                const items = data.items || [];
                panel.innerHTML = items.length ? items.map(item => `<button class="claude-resume-item" onclick="selectCodexResumeThread(decodePathValue('${encodePathValue(item.id)}'))"><div class="claude-resume-title"><span>${escapeHtml((item.preview || 'Codex session').slice(0, 48))}${item.current ? ' · current' : ''}</span><span>${escapeHtml(item.updatedAt ? new Date(item.updatedAt).toLocaleString() : '')}</span></div><div class="claude-resume-meta">${escapeHtml(item.id.slice(0, 12))}</div></button>`).join('') : '<div class="claude-resume-meta" style="padding:12px;">No Codex sessions found for this folder.</div>';
            } catch (e) { panel.innerHTML = `<div class="claude-resume-meta" style="padding:12px;color:#ff6b61;">${escapeHtml(e.message)}</div>`; }
        }
        async function selectCodexResumeThread(threadId) {
            const res = await fetchWithTimeout(`/api/sessions/${activeSessionId}/codex-resume`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ threadId }) }, 30000);
            if (!res.ok) { alert((await res.json()).error || 'Unable to resume Codex thread'); return; }
            codexResumePanelOpen = false;
            document.getElementById('codex-resume-panel').classList.remove('active');
            updateTerminalControlsHeight();
        }
        async function toggleCodexPresentation() {
            const presentation = codexState.presentation === 'terminal' ? 'structured' : 'terminal';
            const res = await fetchWithTimeout(`/api/sessions/${activeSessionId}/codex-presentation`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ presentation }) }, 30000);
            if (!res.ok) alert((await res.json()).error || 'Unable to switch Codex interface');
        }

        function joinSession(id, sessionName, toolKey = null) {
            stopTimedInputTimers();
            activeSessionId = id;
            window.activeSessionId = id;
            activeToolKey = toolKey;
            clearTimeout(sessionPollTimer);
            sessionPollTimer = null;
            markCompletionRead(id);
            loadTimedInputs();
            document.getElementById('session-title').innerText = sessionName;
            updateToolShortcuts(activeToolKey);
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('terminal-view').classList.add('active');
            setClaudeModeEnabled(isClaudeSession());
            if (currentSocket) { currentSocket.close(); currentSocket = null; }
            initTerminal(id);
        }

        function initTerminal(sessionId) {
            if (isClaudeSession()) {
                initClaudeSession(sessionId);
                return;
            }
            if (isCodexSession() && codexState.presentation === 'structured') {
                initCodexSession(sessionId);
                return;
            }
            if (typeof Terminal === 'undefined') {
                alert('Terminal library not loaded yet.');
                showLobby();
                return;
            }
            function isTerminalAutoResponse(data) {
                return /^\x1b\[\?[\d;]*c$/.test(data) || /^\x1b\[>[\d;]*c$/.test(data);
            }
            if (!term) {
                term = new Terminal({ theme: { background: '#000', foreground: '#fff', cursor: '#0f0' }, cursorBlink: true, fontSize: 14, cursorStyle: 'bar', scrollback: 10000 });
                fitAddon = new FitAddon.FitAddon();
                term.loadAddon(fitAddon);
                term.open(document.getElementById('terminal'));
                term.onData(data => {
                    if (isTerminalAutoResponse(data)) return;
                    let finalData = data;
                    if (modifiers.ctrl && data.length === 1) {
                        const code = data.toLowerCase().charCodeAt(0);
                        if (code >= 97 && code <= 122) finalData = String.fromCharCode(code - 96);
                    }
                    sendWS(finalData);
                });
            } else { term.clear(); }
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            currentSocket = new WebSocket(protocol + '//' + window.location.host + '?sessionId=' + sessionId);
            currentSocket.onopen = () => {
                syncLayout();
                setTimeout(() => logViewSnapshot('ws-open'), 300);
            };
            currentSocket.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'output') term.write(msg.data);
                if (msg.type === 'reset') term.reset();
                if (msg.type === 'codex-event' && isCodexSession()) {
                    applyCodexEvent(msg.event);
                    if (msg.event?.type === 'presentation' && msg.event.presentation === 'structured') {
                        currentSocket.close();
                        currentSocket = null;
                        initCodexSession(sessionId);
                    }
                }
                if (msg.type === 'exit') showLobby();
            };
        }

        async function initClaudeSession(sessionId) {
            claudeMessages = [];
            claudePendingPermissions = [];
            claudeStatus = 'idle';
            const runtimeConfig = await refreshClaudeRuntimeConfig();
            claudeState = {
                permissionMode: 'default',
                model: (runtimeConfig && runtimeConfig.defaultModel) || 'default',
                effort: (runtimeConfig && runtimeConfig.defaultEffort) || 'medium',
                contextRemaining: null,
                latestUsage: null,
                claudeSessionId: null,
                resumeSessionId: null,
                canAbort: false,
                pendingPermissionCount: 0
            };
            claudeResumePanelOpen = false;
            claudePickerOpen = null;
            claudeResumeItemsLoaded = false;
            document.getElementById('claude-resume-panel').classList.remove('active');
            document.getElementById('claude-resume-panel').innerHTML = '';
            closeClaudePicker();
            updateTerminalControlsHeight();
            applyClaudeRuntimeConfig(runtimeConfig);
            applyClaudeState(claudeState);
            renderClaudeChat();
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            currentSocket = new WebSocket(protocol + '//' + window.location.host + '?sessionId=' + sessionId);
            currentSocket.onopen = () => logViewSnapshot('claude-ws-open');
            currentSocket.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'claude-snapshot' && msg.snapshot) {
                    claudeMessages = msg.snapshot.messages || [];
                    claudePendingPermissions = msg.snapshot.pendingPermissions || [];
                    claudeStatus = msg.snapshot.status || 'idle';
                    applyClaudeState(msg.snapshot.state || {
                        status: claudeStatus,
                        pendingPermissionCount: claudePendingPermissions.filter(item => item.status === 'pending').length,
                        canAbort: claudeStatus === 'thinking'
                    });
                    renderClaudeChat();
                }
                if (msg.type === 'claude-event') applyClaudeEvent(msg.event);
                if (msg.type === 'exit') showLobby();
            };
        }

        function initCodexSession(sessionId) {
            codexMessages = [];
            codexPendingPermissions = [];
            codexModelPanelOpen = false;
            codexModelCandidate = null;
            codexResumePanelOpen = false;
            document.getElementById('codex-model-panel').classList.remove('active');
            document.getElementById('codex-resume-panel').classList.remove('active');
            codexState = { permissionMode: 'on-request', model: null, effort: null, status: 'idle', threadId: null, presentation: 'structured', models: [], canAbort: false, canSwitchToTerminal: false, canSwitchToStructured: false };
            setClaudeModeEnabled(false);
            applyCodexState(codexState);
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            currentSocket = new WebSocket(protocol + '//' + window.location.host + '?sessionId=' + sessionId);
            currentSocket.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'codex-snapshot' && msg.snapshot) {
                    codexMessages = msg.snapshot.messages || [];
                    codexPendingPermissions = msg.snapshot.pendingPermissions || [];
                    applyCodexState(msg.snapshot.state || {});
                }
                if (msg.type === 'codex-event') {
                    applyCodexEvent(msg.event);
                    if (msg.event?.type === 'presentation' && msg.event.presentation === 'terminal') {
                        currentSocket.close();
                        currentSocket = null;
                        initTerminal(sessionId);
                    }
                }
                if (msg.type === 'exit') showLobby();
            };
        }

        function sendWS(data) { 
            if (currentSocket && currentSocket.readyState === 1) currentSocket.send(JSON.stringify({ type: 'input', data })); 
        }
        
        let layoutTimer = null;
        let layoutKeepAtBottom = false;

        function isTerminalAtBottom() {
            if (!term || !term.buffer || !term.buffer.active) return true;
            const active = term.buffer.active;
            return active.viewportY >= active.baseY - 1;
        }

        function scrollTerminalViewportToBottom() {
            if (!term) return;
            term.scrollToBottom();
            const viewport = document.querySelector('#terminal .xterm-viewport');
            if (viewport) viewport.scrollTop = viewport.scrollHeight;
        }

        function restoreTerminalBottomSoon() {
            scrollTerminalViewportToBottom();
            requestAnimationFrame(() => {
                scrollTerminalViewportToBottom();
                requestAnimationFrame(scrollTerminalViewportToBottom);
            });
            setTimeout(scrollTerminalViewportToBottom, 120);
        }

        function syncLayout(options = {}) {
            if (!fitAddon || !currentSocket) return;
            const keepAtBottom = typeof options.keepAtBottom === 'boolean' ? options.keepAtBottom : isTerminalAtBottom();
            layoutKeepAtBottom = layoutKeepAtBottom || keepAtBottom;
            clearTimeout(layoutTimer);
            layoutTimer = setTimeout(() => {
                const shouldRestoreBottom = layoutKeepAtBottom;
                layoutKeepAtBottom = false;
                fitAddon.fit();
                if (shouldRestoreBottom) restoreTerminalBottomSoon();
                if (currentSocket.readyState === 1) currentSocket.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows })); 
            }, 50); 
        }

        function previewText(text, maxChars = 320) {
            if (!text) return '';
            const normalized = String(text)
                .replace(/\r/g, '\\r')
                .replace(/\n/g, '\\n')
                .replace(/\t/g, '\\t')
                .replace(/\x1b/g, '\\x1b');
            return normalized.length > maxChars ? normalized.slice(-maxChars) : normalized;
        }

        async function logClientDebug(event, payload) {
            try {
                await fetch('/api/debug/client-log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId: activeSessionId, event, payload })
                });
            } catch (_) {}
        }

        function snapshotTerminalBuffer(maxLines = 12) {
            if (!term || !term.buffer || !term.buffer.active) return null;
            const active = term.buffer.active;
            const totalLines = active.length || 0;
            const start = Math.max(0, totalLines - maxLines);
            const tailLines = [];
            for (let i = start; i < totalLines; i++) {
                const line = active.getLine(i);
                if (!line) continue;
                tailLines.push(line.translateToString(true));
            }
            return {
                cols: term.cols,
                rows: term.rows,
                baseY: active.baseY,
                viewportY: active.viewportY,
                cursorX: active.cursorX,
                cursorY: active.cursorY,
                totalLines,
                tailPreview: previewText(tailLines.join('\n'))
            };
        }

        function logViewSnapshot(event) {
            logClientDebug(event, {
                sessionId: activeSessionId,
                terminalSnapshot: snapshotTerminalBuffer()
            });
        }

            clearTimeout(sessionPollTimer);

        let historyWrapEnabled = true;

        function showHistory() {

            sessionPollTimer = null;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('history-view').classList.add('active');

        function toggleHistoryWrap() {
            historyWrapEnabled = !historyWrapEnabled;
            const contentEl = document.getElementById('history-content');
            contentEl.classList.toggle('nowrap', !historyWrapEnabled);
            document.getElementById('history-wrap-btn').style.color = historyWrapEnabled ? 'var(--primary)' : 'var(--text-dim)';
        }

        async function loadHistory() {
            const contentEl = document.getElementById('history-content');
            const metaEl = document.getElementById('history-meta');
            if (!activeSessionId) {
                metaEl.textContent = 'No active session.';
                contentEl.textContent = '';
                return;
            }

            metaEl.textContent = 'Loading...';
            try {
                const res = await fetchWithTimeout(`/api/sessions/${activeSessionId}/history`, {}, 30000);
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'Failed to load history');

                const updatedAt = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString() : 'unknown';
                const size = typeof data.bytes === 'number' ? `${Math.round(data.bytes / 1024)} KB` : 'unknown size';
                const truncated = data.truncated ? ' | truncated' : '';
                metaEl.textContent = `${data.tool || 'Session'} | ${data.lines || 0} lines | ${size} | updated ${updatedAt}${truncated}`;
                contentEl.textContent = data.text || 'No readable history yet.';
                contentEl.classList.toggle('nowrap', !historyWrapEnabled);
                document.getElementById('history-wrap-btn').style.color = historyWrapEnabled ? 'var(--primary)' : 'var(--text-dim)';
                logClientDebug('history-loaded', {
                    meta: metaEl.textContent,
                    historyLines: data.lines || 0,
                    historyBytes: data.bytes || 0,
                    historyTail: previewText(data.text || '')
                });
                requestAnimationFrame(() => {
                    contentEl.scrollTop = contentEl.scrollHeight;
                });
            } catch (e) {
                metaEl.textContent = 'Failed to load history.';
                contentEl.textContent = e.message;
                logClientDebug('history-load-failed', { message: e.message });
            }
        }

        async function copyHistoryContent() {
            const contentEl = document.getElementById('history-content');
            const text = contentEl.textContent || '';
            if (!text || text === 'Loading...' || text === 'No readable history yet.') {
                alert('No history to copy.');
                return;
            }

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const range = document.createRange();
                    range.selectNode(contentEl);
                    window.getSelection().removeAllRanges();
                    window.getSelection().addRange(range);
                    document.execCommand('copy');
                    window.getSelection().removeAllRanges();
                }

        function initTimedDelaySelectors() {
            const hours = document.getElementById('timed-hours');
            const minutes = document.getElementById('timed-minutes');
            if (hours.options.length) return;
            for (let i = 0; i <= 23; i++) {
                hours.add(new Option(`${i} hr`, String(i)));
            }
            for (let i = 0; i <= 59; i++) {
                minutes.add(new Option(`${i} min`, String(i)));
            }
            hours.value = '0';
            minutes.value = '5';
        }

        function getTimedDelayMs() {
            const hours = Number(document.getElementById('timed-hours').value);
            const minutes = Number(document.getElementById('timed-minutes').value);
            const delayMs = ((hours * 60) + minutes) * 60 * 1000;
            return Number.isFinite(delayMs) && delayMs > 0 ? delayMs : 0;
        }

        function parseSendAt() {
            const delayMs = getTimedDelayMs();
            return delayMs > 0 ? Date.now() + delayMs : null;
        }

        function setTimedDelayFromMs(ms) {
            const totalMinutes = Math.max(1, Math.ceil(ms / 60000));
            const hours = Math.min(23, Math.floor(totalMinutes / 60));
            const minutes = Math.min(59, totalMinutes - hours * 60);
            document.getElementById('timed-hours').value = String(hours);
            document.getElementById('timed-minutes').value = String(minutes);
        }

        function updateTimedSendPreview() {
            const preview = document.getElementById('timed-preview');
            const sendAt = parseSendAt();
            preview.textContent = sendAt
                ? `Will run at ${new Date(sendAt).toLocaleString()}`
                : 'Choose at least 1 minute.';
        }

        function formatCountdown(sendAt) {
            const remaining = Math.max(0, sendAt - Date.now());
            const totalSeconds = Math.ceil(remaining / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            if (hours > 0) return `${hours}h\n${String(minutes).padStart(2, '0')}m`;
            return `${minutes}:${String(seconds).padStart(2, '0')}`;
        }

        window.loadCommitDiff = async function(hash) {
            if (!activeSessionId) return;
            const content = document.getElementById('git-content');
            content.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-dim);">Loading diff...</div>';
            currentCommitHash = hash;
            
            try {
                const res = await fetch(`/api/sessions/${activeSessionId}/git-show/${hash}`);
                const data = await res.json();
                if (data.success) {
                    let fileBlocks = [];
                    let currentBlock = { name: 'Commit Details', lines: [] };
                    fileBlocks.push(currentBlock);
                    
                    const lines = data.stdout.split('\n');
                    for (const line of lines) {
                        const diffMatch = line.match(/^diff --git a\/(.+?) b\//);
                        if (diffMatch) {
                            currentBlock = { name: diffMatch[1], lines: [] };
                            fileBlocks.push(currentBlock);
                        }
                        currentBlock.lines.push(line);
                    }
                    
                    let diffHTML = '';
                    for (const block of fileBlocks) {
                        if (block.lines.length === 0 || (block.lines.length === 1 && !block.lines[0])) continue;
                        
                        let blockContent = '';
                        let addCount = 0;
                        let subCount = 0;
                        for (const line of block.lines) {
                            let color = '#ccc', bg = 'transparent', borderLeft = '2px solid transparent';
                            if (line.startsWith('+') && !line.startsWith('+++')) { color = '#4ade80'; bg = 'rgba(74, 222, 128, 0.1)'; borderLeft = '2px solid #4ade80'; addCount++; }
                            else if (line.startsWith('-') && !line.startsWith('---')) { color = '#f87171'; bg = 'rgba(248, 113, 113, 0.1)'; borderLeft = '2px solid #f87171'; subCount++; }
                            else if (line.startsWith('@@')) { color = '#60a5fa'; bg = 'rgba(96, 165, 250, 0.1)'; }
                            else if (line.startsWith('diff') || line.startsWith('index') || line.startsWith('commit') || line.startsWith('Author') || line.startsWith('Date')) color = '#fff';
                            
                            blockContent += `<div style="color:${color}; background:${bg}; border-left:${borderLeft}; padding:2px 8px; white-space:pre-wrap; word-break:break-all;">${line.replace(/</g, '&lt;').replace(/>/g, '&gt;') || ' '}</div>`;
                        }
                        
                        const isOpen = block.name === 'Commit Details';
                        const statHTML = block.name !== 'Commit Details' ? `<span style="margin-left: 12px; font-family: monospace; font-size: 12px;"><span style="color:#4ade80;">+${addCount}</span> <span style="color:#f87171; margin-left:6px;">-${subCount}</span></span>` : '';
                        diffHTML += `
                            <details ${isOpen ? 'open' : ''} style="margin-bottom: 8px; border: 1px solid #333; border-radius: 4px; overflow: hidden;">
                                <summary style="background: #1e1e1e; padding: 6px 10px; cursor: pointer; color: #fff; font-weight: 500; font-size: 13px; outline: none; user-select: none;">
                                    ${block.name === 'Commit Details' ? '📝 ' : '📄 '}${block.name.replace(/</g, '&lt;').replace(/>/g, '&gt;')}${statHTML}
                                </summary>
                                <div style="background: #0d0d0d; overflow-x: auto; font-family: monospace; font-size: 12px; line-height: 1.5; padding: 4px 0;">
                                    ${blockContent}
                                </div>
                            </details>
                        `;
                    }
                    currentCommitDiffHTML = diffHTML;
                    renderCommitDiffFullView();
                } else {
                    content.innerHTML = `<p style="color:#ff3b30; padding:10px;">Error loading diff</p>`;
                }
            } catch (e) {
                content.innerHTML = `<p style="color:#ff3b30; padding:10px;">Network error</p>`;
            }
        };

        async function loadGitStatus() {
            const content = document.getElementById('git-content');
            content.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">Loading...</p>';
            if (!activeSessionId) return;
            try {
                const [resStatus, resUnstaged, resStaged] = await Promise.all([
                    fetchWithTimeout(`/api/sessions/${activeSessionId}/git-status`),
                    fetchWithTimeout(`/api/sessions/${activeSessionId}/git-diff-numstat?staged=false`).catch(() => ({ok:false})),
                    fetchWithTimeout(`/api/sessions/${activeSessionId}/git-diff-numstat?staged=true`).catch(() => ({ok:false}))
                ]);
                
                const data = await resStatus.json();
                if (!data.success) {
                    content.innerHTML = `<p style="color:#ff3b30; padding:10px;">Git error: ${data.error}</p>`;
                    return;
                }
                const files = Array.isArray(data.files) ? data.files : [];

                if (files.length === 0) {
                    content.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">No changes detected.</p>';
                    return;
                }

                let statsMap = {};
                const parseNumstat = (output) => {
                    if (!output) return;
                    output.split('\n').forEach(line => {
                        const parts = line.split('\t');
                        if (parts.length >= 3) {
                            const added = parseInt(parts[0]) || 0;
                            const removed = parseInt(parts[1]) || 0;
                            const file = parts.slice(2).join('\t');
                            if (!statsMap[file]) statsMap[file] = { added: 0, removed: 0 };
                            statsMap[file].added += added;
                            statsMap[file].removed += removed;
                        }
                    });
                };

                if (resUnstaged.ok) {
                    const unstagedData = await resUnstaged.json();
                    if (unstagedData.success) parseNumstat(unstagedData.stdout);
                }
                if (resStaged.ok) {
                    const stagedData = await resStaged.json();
                    if (stagedData.success) parseNumstat(stagedData.stdout);
                }

                let html = '<div style="padding:10px;">';
                files.forEach((f, idx) => {
                    const encodedPath = encodePathValue(f.path);
                    const escapedPath = escapeHtml(f.path);
                    let color = '#fff';
                    let label = f.status;
                    if (label.includes('M')) { color = '#f59e0b'; }
                    else if (label.includes('A') || label === '??') { color = '#4ade80'; if(label === '??') label = 'U'; }
                    else if (label.includes('D')) { color = '#f87171'; }
                    const isUntracked = f.status === '??';
                    const hasStaged = !isUntracked && f.status[0] && f.status[0] !== ' ';
                    const hasUnstaged = !isUntracked && f.status[1] && f.status[1] !== ' ';

                    let statHTML = '';
                    if (statsMap[f.path]) {
                        const { added, removed } = statsMap[f.path];
                        if (added > 0 || removed > 0) {
                            statHTML = `<span style="margin-left: 12px; font-family: monospace; font-size: 12px; white-space: nowrap;"><span style="color:#4ade80;">+${added}</span> <span style="color:#f87171; margin-left:6px;">-${removed}</span></span>`;
                        }
                    }

                    html += `<div style="margin-bottom: 8px; border: 1px solid #333; border-radius: 4px; background: #1e1e1e; overflow: hidden;">
                        <div onclick="toggleInlineDiff('${encodedPath}', 'inline-diff-${idx}', ${!!hasStaged}, ${!!hasUnstaged}, ${isUntracked})" style="padding: 6px 10px; cursor: pointer; color: #fff; font-weight: 500; font-size: 13px; outline: none; user-select: none; display: flex; align-items: center;">
                            <div style="flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">📄 ${escapedPath}${statHTML}</div>
                            <span style="color:${color}; font-weight:700; font-size:10px; border:1px solid ${color}; padding:1px 4px; border-radius:3px; opacity:0.8; flex-shrink: 0; margin-left: 8px;">${label}</span>
                        </div>
                        <div id="inline-diff-${idx}" style="display: none;" data-loaded="false"></div>
                    </div>`;
                });
                html += '</div>';
                content.innerHTML = html;
            } catch (e) {
                content.innerHTML = `<p style="color:#ff3b30; padding:10px;">${e.message}</p>`;
            }
        }

        function buildFileDiffUrl(path, staged) {
            return `/api/sessions/${activeSessionId}/git-diff-file?path=${encodeURIComponent(path)}&staged=${staged ? 'true' : 'false'}`;
        }

        async function loadFileChangeData(path, options = {}) {
            const hasStaged = !!options.hasStaged;
            const hasUnstaged = !!options.hasUnstaged;
            const isUntracked = !!options.isUntracked;
            const diffRequests = [];

            if (hasStaged) {
                diffRequests.push({
                    label: 'Staged changes',
                    promise: fetchWithTimeout(buildFileDiffUrl(path, true)).catch(() => ({ok:false}))
                });
            }
            if (hasUnstaged || (!hasStaged && !isUntracked)) {
                diffRequests.push({
                    label: 'Unstaged changes',
                    promise: fetchWithTimeout(buildFileDiffUrl(path, false)).catch(() => ({ok:false}))
                });
            }

            const [diffResponses, fileRes] = await Promise.all([
                Promise.all(diffRequests.map(item => item.promise)),
                fetchWithTimeout(`/api/sessions/${activeSessionId}/file?path=${encodeURIComponent(path)}`).catch(() => ({ok:false}))
            ]);

            const diffParts = [];
            for (let i = 0; i < diffResponses.length; i++) {
                const res = diffResponses[i];
                const data = res.ok ? await res.json() : { success: false };
                if (data.success && data.stdout) {
                    diffParts.push({ label: diffRequests[i].label, stdout: data.stdout });
                }
            }

            const fileData = fileRes.ok ? await fileRes.json() : { success: false };
            const content = fileData.success ? fileData.content : '';
            let diff = diffParts.map(part => (
                diffParts.length > 1 ? `# ${part.label}\n${part.stdout}` : part.stdout
            )).join('\n');
            if (!diff && isUntracked && content) diff = 'Untracked file:\n\n' + content;

            return {
                diff,
                content,
                renderRawDiff: diffParts.length > 1
            };
        }

        window.toggleInlineDiff = async function(encodedPath, containerId, hasStaged = false, hasUnstaged = true, isUntracked = false) {
            const container = document.getElementById(containerId);
            if (container.style.display === 'block') {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'block';
            if (container.dataset.loaded === 'true') return;

            const path = decodePathValue(encodedPath);
            container.innerHTML = '<div style="padding: 10px; color: var(--text-dim); text-align: center; font-size: 12px;">Loading...</div>';

            try {
                const { diff: currentFileDiff, content: currentFileContent } = await loadFileChangeData(path, {
                    hasStaged,
                    hasUnstaged,
                    isUntracked
                });

                if (!currentFileDiff && !currentFileContent) {
                    container.innerHTML = `<div style="padding: 10px; color: #f87171; font-size: 12px; text-align:center;">No diff available</div>`;
                    return;
                }

                let blockContent = '';
                currentFileDiff.split('\n').forEach(line => {
                    let color = '#ccc', bg = 'transparent', borderLeft = '2px solid transparent';
                    if (line.startsWith('+') && !line.startsWith('+++')) { color = '#4ade80'; bg = 'rgba(74, 222, 128, 0.1)'; borderLeft = '2px solid #4ade80'; }
                    else if (line.startsWith('-') && !line.startsWith('---')) { color = '#f87171'; bg = 'rgba(248, 113, 113, 0.1)'; borderLeft = '2px solid #f87171'; }
                    else if (line.startsWith('@@')) { color = '#60a5fa'; bg = 'rgba(96, 165, 250, 0.1)'; }

                    blockContent += `<div style="color:${color}; background:${bg}; border-left:${borderLeft}; padding:2px 8px; white-space:pre-wrap; word-break:break-all;">${escapeHtml(line) || ' '}</div>`;
                });

                container.dataset.loaded = 'true';
                container.innerHTML = `
                    <div style="background: #0d0d0d; overflow-x: auto; font-family: monospace; font-size: 12px; line-height: 1.5; padding: 4px 0; border-top: 1px solid #333; max-height: 400px;">
                        ${blockContent}
                    </div>
                    <div style="padding: 8px; background: #1a1a1a; border-top: 1px solid #333; text-align: center;">
                        <button onclick="showFileDetails(decodePathValue('${encodedPath}'), true, ${!!hasStaged}, ${!!hasUnstaged}, ${!!isUntracked})" style="background: var(--primary); border: none; color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                            View Full File
                        </button>
                    </div>
                `;
            } catch (e) {
                container.innerHTML = `<div style="padding: 10px; color: #f87171; font-size: 12px; text-align:center;">Error: ${e.message}</div>`;
            }
        };

        let currentFilePath = '', currentFileDiff = '', currentFileContent = '', currentFileMode = 'diff', currentFileWrap = false, currentFontSize = 12, currentFileRenderRawDiff = false;

        function changeFontSize(delta) {
            if (delta === 0) currentFontSize = 12;
            else currentFontSize = Math.max(8, Math.min(32, currentFontSize + delta));
            renderFileDetails();
        }

        async function showFileDetails(path, isFromChanges = true, hasStaged = false, hasUnstaged = true, isUntracked = false) {
            currentFilePath = path;
            currentFileMode = isFromChanges ? 'diff' : 'file';
            currentFileRenderRawDiff = false;
            const content = document.getElementById('git-content');
            content.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">Loading details...</p>';
            try {
                const detailData = await loadFileChangeData(path, {
                    hasStaged: isFromChanges ? hasStaged : false,
                    hasUnstaged: isFromChanges ? hasUnstaged : true,
                    isUntracked: isFromChanges ? isUntracked : false
                });
                currentFileDiff = detailData.diff;
                currentFileContent = detailData.content;
                currentFileRenderRawDiff = detailData.renderRawDiff;
                if (!currentFileDiff && !currentFileContent) {
                     content.innerHTML = `<p style="color:#ff3b30; padding:10px;">Failed to load details.</p>`;
                     return;
                }
                if (!currentFileDiff && !isFromChanges) currentFileMode = 'file';
                renderFileDetails();
            } catch (e) { content.innerHTML = `<p style="color:#ff3b30; padding:10px;">${e.message}</p>`; }
        }

        function toggleFileMode() { currentFileMode = currentFileMode === 'diff' ? 'file' : 'diff'; renderFileDetails(); }
        function toggleFileWrap() { currentFileWrap = !currentFileWrap; renderFileDetails(); }

        function renderFileDetails() {
            const content = document.getElementById('git-content');
            let html = `
            <div style="display:flex; align-items:center; background: var(--card-bg); padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 10;">
                <button class="icon-btn" onclick="switchGitTab(currentGitTab)" style="color: var(--primary); margin-right: 12px; font-weight:600; font-size:14px; display:flex; align-items:center; flex-shrink: 0;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg> Back
                </button>
                <div style="flex:1; min-width:0; margin-right: 12px;">
                    <div style="font-weight:600; font-size:15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${escapeHtml(currentFilePath)}">${escapeHtml(currentFilePath.split('/').pop() || currentFilePath)}</div>
                </div>`;

            if (currentFileDiff && currentFileContent) {
                html += `
                <div style="display: flex; gap: 6px; flex-shrink: 0; align-items: center;">
                    <div style="display: flex; gap: 2px; margin-right: 8px; background: rgba(0,0,0,0.3); padding: 2px; border-radius: 4px;">
                        <button onclick="changeFontSize(-1)" style="background: transparent; border: none; color: #aaa; padding: 4px 8px; font-size: 12px; cursor: pointer; outline: none; border-radius: 3px;" title="Zoom Out" onmouseover="this.style.background='rgba(255,255,255,0.1)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='#aaa'">A-</button>
                        <button onclick="changeFontSize(0)" style="background: transparent; border: none; color: #aaa; padding: 4px 8px; font-size: 12px; cursor: pointer; outline: none; border-radius: 3px;" title="Reset Size" onmouseover="this.style.background='rgba(255,255,255,0.1)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='#aaa'">${currentFontSize}</button>
                        <button onclick="changeFontSize(1)" style="background: transparent; border: none; color: #aaa; padding: 4px 8px; font-size: 12px; cursor: pointer; outline: none; border-radius: 3px;" title="Zoom In" onmouseover="this.style.background='rgba(255,255,255,0.1)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='#aaa'">A+</button>
                    </div>
                    <button onclick="toggleFileMode()" style="background: ${currentFileMode === 'diff' ? 'var(--primary)' : 'rgba(255,255,255,0.1)'}; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; outline: none;">
                        Diff
                    </button>
                    <button onclick="toggleFileWrap()" style="background: ${currentFileWrap ? 'var(--primary)' : 'rgba(255,255,255,0.1)'}; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; outline: none;">
                        Wrap
                    </button>
                </div>`;
            } else {
                 html += `
                <div style="display: flex; gap: 6px; flex-shrink: 0; align-items: center;">
                    <div style="display: flex; gap: 2px; margin-right: 8px; background: rgba(0,0,0,0.3); padding: 2px; border-radius: 4px;">
                        <button onclick="changeFontSize(-1)" style="background: transparent; border: none; color: #aaa; padding: 4px 8px; font-size: 12px; cursor: pointer; outline: none; border-radius: 3px;" title="Zoom Out" onmouseover="this.style.background='rgba(255,255,255,0.1)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='#aaa'">A-</button>
                        <button onclick="changeFontSize(0)" style="background: transparent; border: none; color: #aaa; padding: 4px 8px; font-size: 12px; cursor: pointer; outline: none; border-radius: 3px;" title="Reset Size" onmouseover="this.style.background='rgba(255,255,255,0.1)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='#aaa'">${currentFontSize}</button>
                        <button onclick="changeFontSize(1)" style="background: transparent; border: none; color: #aaa; padding: 4px 8px; font-size: 12px; cursor: pointer; outline: none; border-radius: 3px;" title="Zoom In" onmouseover="this.style.background='rgba(255,255,255,0.1)';this.style.color='#fff'" onmouseout="this.style.background='transparent';this.style.color='#aaa'">A+</button>
                    </div>
                    <button onclick="toggleFileWrap()" style="background: ${currentFileWrap ? 'var(--primary)' : 'rgba(255,255,255,0.1)'}; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; outline: none;">
                        Wrap
                    </button>
                </div>`;
            }

            html += `</div>`;

            const wrapStyle = currentFileWrap ? 'white-space: pre-wrap; word-break: break-all;' : 'white-space: pre;';
            const innerWrapStyle = currentFileWrap ? '' : 'min-width: max-content;';
            html += `<div style="padding: 10px;">`;
            html += `<div style="background:#0d0d0d; border-radius:8px; overflow-x:auto; font-family:monospace; font-size:${currentFontSize}px; line-height:1.5; padding: 12px 0; margin: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;">`;
            html += `<div style="${innerWrapStyle}">`;

            let mergedLines = [];
            const lines = currentFileContent ? currentFileContent.replace(/\r\n/g, '\n').split('\n') : [];

            if (currentFileMode === 'diff' && currentFileDiff && !currentFileDiff.startsWith('Untracked file:')) {
                let diffHunks = [];
                let currentHunk = null;
                const diffLines = currentFileDiff.replace(/\r\n/g, '\n').split('\n');
                for (const dl of diffLines) {
                    if (dl.startsWith('---') || dl.startsWith('+++')) continue;
                    let match = dl.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
                    if (match) {
                        currentHunk = {
                            newStart: parseInt(match[2], 10),
                            lines: []
                        };
                        diffHunks.push(currentHunk);
                    } else if (currentHunk) {
                        currentHunk.lines.push(dl);
                    }
                }

                if (currentFileRenderRawDiff || diffHunks.length === 0) {
                    currentFileDiff.replace(/\r\n/g, '\n').split('\n').forEach(line => {
                        mergedLines.push({ type: 'raw', text: line });
                    });
                } else {
                    let contentLineIdx = 1;
                    for (let hunk of diffHunks) {
                        while (contentLineIdx < hunk.newStart && contentLineIdx <= lines.length) {
                            mergedLines.push({ type: 'normal', text: lines[contentLineIdx - 1], lineNum: contentLineIdx });
                            contentLineIdx++;
                        }
                        for (let dl of hunk.lines) {
                            if (dl.startsWith('-')) {
                                mergedLines.push({ type: 'deleted', text: dl.substring(1) });
                            } else if (dl.startsWith('+')) {
                                mergedLines.push({ type: 'added', text: dl.substring(1), lineNum: contentLineIdx });
                                contentLineIdx++;
                            } else if (dl.startsWith(' ')) {
                                mergedLines.push({ type: 'normal', text: dl.substring(1), lineNum: contentLineIdx });
                                contentLineIdx++;
                            }
                        }
                    }
                    while (contentLineIdx <= lines.length) {
                        mergedLines.push({ type: 'normal', text: lines[contentLineIdx - 1], lineNum: contentLineIdx });
                        contentLineIdx++;
                    }
                }
            } else {
                lines.forEach((line, idx) => {
                    mergedLines.push({ type: 'normal', text: line, lineNum: idx + 1 });
                });
            }

            mergedLines.forEach(item => {
                let color = '#ccc', bg = 'transparent', borderLeft = '2px solid transparent';
                let prefix = ' ';
                if (item.type === 'added') { color = '#4ade80'; bg = 'rgba(74, 222, 128, 0.1)'; borderLeft = '2px solid #4ade80'; prefix = '+'; }
                else if (item.type === 'deleted') { color = '#f87171'; bg = 'rgba(248, 113, 113, 0.1)'; borderLeft = '2px solid #f87171'; prefix = '-'; }
                else if (item.type === 'raw') {
                    if (item.text.startsWith('+') && !item.text.startsWith('+++')) { color = '#4ade80'; bg = 'rgba(74, 222, 128, 0.1)'; borderLeft = '2px solid #4ade80'; }
                    else if (item.text.startsWith('-') && !item.text.startsWith('---')) { color = '#f87171'; bg = 'rgba(248, 113, 113, 0.1)'; borderLeft = '2px solid #f87171'; }
                    else if (item.text.startsWith('@@')) { color = '#60a5fa'; bg = 'rgba(96, 165, 250, 0.1)'; }
                    prefix = '';
                }

                const renderedText = item.type === 'raw' ? item.text : `${prefix} ${item.text}`;
                html += `<div style="color:${color}; background:${bg}; border-left:${borderLeft}; padding: 0 12px 0 8px; display:flex;">`;
                html += `<div style="color:#555; margin-right:16px; user-select:none; flex-shrink:0; width: 36px; text-align:right;">${item.lineNum || ''}</div>`;
                html += `<div style="flex:1; min-width:0; ${wrapStyle}">${escapeHtml(renderedText) || ' '}</div>`;
                html += `</div>`;
            });

            html += `</div></div></div>`;
            content.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            refreshSessionsNow();
            document.addEventListener('visibilitychange', refreshSessionsNow);
        });
    </script>
</body>
</html>
