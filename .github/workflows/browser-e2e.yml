name: Browser E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Browser E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ["iPhone 17 Pro Max", "iPad Air 7", "MacBook Pro 16"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser contract tests on port 3001
        env:
          PROJECT: ${{ matrix.project }}
        run: npx playwright test --project "$PROJECT"
      - name: Retain browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ strategy.job-index }}
          path: |
            .playwright-report/
            .playwright-results/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
