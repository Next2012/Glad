name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, artifact: glad-linux-amd64, smoke: true }
          - { runner: ubuntu-latest, goos: linux, goarch: arm64, artifact: glad-linux-arm64, smoke: false }
          - { runner: windows-latest, goos: windows, goarch: amd64, artifact: glad-windows-amd64.exe, smoke: true }
          - { runner: macos-15-intel, goos: darwin, goarch: amd64, artifact: glad-macos-x64, smoke: true }
          - { runner: macos-14, goos: darwin, goarch: arm64, artifact: glad-macos-arm64, smoke: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build ${{ matrix.artifact }}
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o ${{ matrix.artifact }} .
      - if: matrix.goos != 'windows'
        shell: bash
        run: chmod 755 ${{ matrix.artifact }}
      - name: Smoke test native binary
        if: matrix.smoke
        shell: bash
        run: ./${{ matrix.artifact }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Flatten build artifacts
        run: |
          mkdir -p dist
          find dist-artifacts -maxdepth 2 -type f -exec cp {} dist/ \;
          sha256sum dist/* > dist/SHA256SUMS
      - name: Stage npm platform packages
        run: node scripts/stage-npm-packages.js "${GITHUB_REF_NAME#v}" dist staged-npm
      - name: Publish platform packages first
        env:
          # Bootstrap fallback for the first publication of new platform packages.
          # After all packages have this workflow configured as a trusted publisher,
          # npm uses OIDC and this secret can be removed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for package in staged-npm/platforms/*; do
            name="$(node -p "require('./$package/package.json').name")"
            version="$(node -p "require('./$package/package.json').version")"
            if npm view "$name@$version" version --json >/dev/null 2>&1; then
              echo "::notice::$name@$version is already published; skipping"
              continue
            fi
            npm publish "./$package" --access public
          done
      - name: Publish main package last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./staged-npm/main/package.json').name")"
          version="$(node -p "require('./staged-npm/main/package.json').version")"
          if npm view "$name@$version" version --json >/dev/null 2>&1; then
            echo "::notice::$name@$version is already published; skipping"
          else
            npm publish ./staged-npm/main --access public
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
