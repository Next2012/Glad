name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Go formatting
        run: test -z "$(gofmt -l *.go internal/app/*.go internal/session/*.go)"
      - name: Vet Go backend
        run: go vet ./...
      - name: Run Go backend and packaging tests
        run: npm test
      - name: Run Go race detector
        run: go test -race ./...
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build native backend
        run: npm run build:linux
      - name: Verify CLI boots
        run: ./glad-linux-amd64 --version
      - name: Validate npm package templates
        run: |
          mkdir -p dist-ci
          for artifact in glad-linux-amd64 glad-linux-arm64 glad-windows-amd64.exe glad-macos-x64 glad-macos-arm64; do cp glad-linux-amd64 "dist-ci/$artifact"; done
          node scripts/stage-npm-packages.js "$(node -p 'require("./package.json").version')" dist-ci staged-npm-ci
          npm pack ./staged-npm-ci/main --dry-run
          for package in staged-npm-ci/platforms/*; do npm pack "$package" --dry-run; done
